name: Deploy LEXORA to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy static site to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: f9e510a0e52ea1cea7b73f095155d82c
          wranglerVersion: "4"
          command: pages deploy . --project-name=lexora-platform --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
